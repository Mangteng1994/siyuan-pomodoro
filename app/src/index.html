<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>思源番茄钟</title>
<style>
  :root {
    color-scheme: light dark;
    font-family: "Microsoft YaHei UI", system-ui, sans-serif;
    --bg: #f6f6f4; --card: #ffffff; --line: rgba(0,0,0,.1); --fg: #1f1f1e; --sub: #6b6b68;
    --accent: #e5483d; --accent-bg: rgba(229,72,61,.1); --ok: #2a8a3e; --bad: #c0392b; --track: rgba(128,128,128,.22);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1c1b; --card: #262625; --line: rgba(255,255,255,.12); --fg: #ececea; --sub: #a3a3a0; --accent-bg: rgba(229,72,61,.2); --ok: #5fc274; --bad: #ec7a6f; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font-size: 14px; display: flex; flex-direction: column; overflow: hidden; }
  button { font: inherit; color: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 7px 14px; }
  button:hover:not(:disabled) { border-color: var(--sub); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.ghost { border-color: transparent; background: transparent; }
  input[type=text], input[type=number], input[type=password] { font: inherit; color: var(--fg); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; width: 100%; }
  input:focus { outline: 2px solid var(--accent-bg); border-color: var(--accent); }

  #bar { display: flex; align-items: center; gap: 8px; padding: 9px 14px; border-bottom: 1px solid var(--line); background: var(--card); }
  #dot { width: 9px; height: 9px; border-radius: 50%; background: var(--sub); flex: none; }
  #dot.on { background: var(--ok); }
  #status { flex: 1; min-width: 0; font-size: 13px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #bar button { padding: 4px 10px; font-size: 12px; }
  #upbanner, #newbanner { display: none; align-items: center; gap: 8px; padding: 7px 14px; background: var(--accent-bg); border-bottom: 1px solid var(--line); font-size: 12px; }
  #upbanner.on, #newbanner.on { display: flex; }
  #upbanner span, #newbanner span { flex: 1; min-width: 0; }
  #upbanner button, #newbanner button { padding: 3px 10px; font-size: 12px; }
  #newbanner { background: var(--card); }
  .cl { padding: 6px 0; border-top: 1px solid var(--line); }
  .cl:first-child { border-top: 0; }
  .cl summary { cursor: pointer; font-size: 13px; font-weight: 600; }
  .cl summary small { font-weight: 400; color: var(--sub); margin-left: 6px; }
  .cl pre { white-space: pre-wrap; font: inherit; font-size: 12px; color: var(--sub); margin: 6px 0 2px; }
  nav button .badge { display: none; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); position: absolute; margin: 2px 0 0 12px; }
  nav button .badge.on { display: inline-block; }
  #upnotes { white-space: pre-wrap; font-size: 12px; color: var(--sub); max-height: 140px; overflow-y: auto; padding: 8px 0; }
  #upbar { height: 4px; border-radius: 2px; background: var(--track); overflow: hidden; margin: 6px 0; display: none; }
  #upfill { height: 100%; width: 0; background: var(--accent); }

  main { flex: 1; min-height: 0; overflow-y: auto; }
  .page { display: none; padding: 16px 18px 20px; }
  .page.on { display: block; }

  nav { display: flex; border-top: 1px solid var(--line); background: var(--card); }
  nav button { flex: 1; border: 0; border-radius: 0; background: transparent; padding: 9px 0 8px; font-size: 12px; color: var(--sub); }
  nav button.on { color: var(--accent); }
  nav button b { display: block; font-size: 17px; font-weight: 400; line-height: 1.2; }

  #msg { position: fixed; left: 14px; right: 14px; bottom: 64px; padding: 8px 12px; border-radius: 8px; background: var(--card); border: 1px solid var(--line); font-size: 13px; white-space: pre-wrap; display: none; }
  #msg.ok { color: var(--ok); } #msg.bad { color: var(--bad); }

  /* 计时页 */
  #ring { width: 190px; height: 190px; margin: 4px auto 12px; border-radius: 50%; background: conic-gradient(from -90deg, var(--accent) var(--deg, 0deg), var(--track) var(--deg, 0deg)); display: flex; align-items: center; justify-content: center; }
  #ring .in { width: 170px; height: 170px; border-radius: 50%; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #clock { font-size: 40px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  #phase { font-size: 12px; color: var(--sub); margin-top: 2px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  #taskcard { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  #taskcard .t { flex: 1; min-width: 0; }
  #taskcard .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #taskcard .doc { font-size: 12px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #taskcard input { padding: 4px 8px; }
  .chips { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-bottom: 12px; }
  .chip { padding: 5px 12px; border-radius: 16px; font-size: 13px; }
  .chip.on { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }
  .recent-task { display: inline-flex; align-items: stretch; }
  .recent-task .chip { border-radius: 16px 0 0 16px; }
  .recent-remove { padding: 5px 9px; border-radius: 0 16px 16px 0; margin-left: -1px; font-size: 13px; color: var(--sub); }
  .chips input { width: 64px; padding: 5px 8px; text-align: center; }
  .btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .btns button { min-width: 84px; }
  #runinfo { text-align: center; font-size: 13px; color: var(--sub); margin-bottom: 12px; min-height: 18px; }
  .grp { display: none; } .grp.on { display: block; }

  /* 任务页 */
  .search { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .search label { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--sub); white-space: nowrap; }
  .search label input { width: auto; }
  #taskinfo { font-size: 12px; color: var(--sub); margin-bottom: 8px; }
  .task { padding: 8px 12px; margin-bottom: 8px; cursor: pointer; }
  .task:hover { border-color: var(--sub); }
  .task.sel { border-color: var(--accent); background: var(--accent-bg); }
  .task .name { font-weight: 600; }
  .task .meta { font-size: 12px; color: var(--sub); margin-top: 2px; }
  .task.done .name { opacity: .6; text-decoration: line-through; }

  /* 设置页 */
  h3 { font-size: 13px; margin: 18px 0 8px; color: var(--sub); font-weight: 600; }
  h3:first-child { margin-top: 0; }
  .f { margin-bottom: 10px; }
  .f label { display: block; font-size: 12px; color: var(--sub); margin-bottom: 4px; }
  .inl { display: flex; gap: 10px; align-items: center; }
  .inl > div { flex: 1; }
  /* 设置页：分组卡片，一行一项 */
  .sh { font-size: 12px; color: var(--sub); margin: 18px 4px 6px; letter-spacing: .04em; }
  .sh:first-child { margin-top: 0; }
  .sc { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 2px 14px; }
  .sr { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 13px; margin: 0; }
  .sr:first-child { border-top: 0; }
  .sr.col { flex-direction: column; align-items: stretch; gap: 6px; }
  .sr.end { justify-content: flex-end; }
  .sl small { display: block; font-size: 11px; color: var(--sub); margin-top: 2px; font-weight: 400; }
  .hint { font-size: 12px; color: var(--sub); }
  #synconow { white-space: nowrap; flex: none; }
  #syncinfo { flex: 1; min-width: 0; }
  .sc input.sn { width: 64px; text-align: center; padding: 5px 6px; flex: none; }
  .pair { display: flex; align-items: center; gap: 6px; color: var(--sub); }
  input.sw { appearance: none; -webkit-appearance: none; width: 34px !important; height: 20px; border-radius: 10px; background: var(--track); border: 0; padding: 0; position: relative; flex: none; cursor: pointer; transition: background .15s; }
  input.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
  input.sw:checked { background: var(--accent); }
  input.sw:checked::after { transform: translateX(14px); }
</style>
</head>
<body>
  <div id="bar">
    <span id="dot"></span>
    <span id="status">检测中…</span>
    <button id="kstart">启动内核</button>
    <button id="kstop" style="display:none">停止内核</button>
    <button id="ui" title="用默认浏览器打开思源界面">打开思源界面</button>
  </div>

  <div id="newbanner"><span id="newtext"></span><button id="newgo">看看</button><button id="newx" class="ghost" aria-label="关闭">×</button></div>
  <div id="upbanner"><span id="uptext"></span><button id="upgo" class="primary">查看</button></div>

  <main>
    <section class="page on" id="p-timer">
      <div id="ring"><div class="in"><div id="clock">25:00</div><div id="phase">准备开始</div></div></div>

      <div class="grp on" id="g-pre">
        <div class="card" id="taskcard">
          <div class="t">
            <div id="tc-sel" style="display:none"><div class="name" id="tc-name"></div><div class="doc" id="tc-doc"></div></div>
            <div id="tc-free"><input id="freetitle" type="text" placeholder="自由专注（可填标题，默认“番茄专注”）"></div>
          </div>
          <button class="ghost" id="tc-pick">选任务</button>
          <button class="ghost" id="tc-clear" style="display:none" title="取消选择，改为自由专注">✕</button>
        </div>
        <div id="recentbox" style="display:none;margin:-4px 0 12px">
          <div style="font-size:12px;color:var(--sub);margin-bottom:4px">最近用过</div>
          <div id="recent" style="display:flex;gap:6px;flex-wrap:wrap"></div>
        </div>
        <div class="chips" id="chips">
          <button class="chip" data-m="15">15</button>
          <button class="chip on" data-m="25">25</button>
          <button class="chip" data-m="45">45</button>
          <input id="minutes" type="number" min="0.1" step="any" value="25" title="自定义分钟数">
          <span style="align-self:center;color:var(--sub);font-size:12px">分钟</span>
        </div>
        <div class="btns"><button class="primary" id="tstart" style="min-width:160px;padding:9px 0">开始</button></div>
      </div>

      <div class="grp" id="g-run">
        <div id="runinfo"></div>
        <div class="btns">
          <button id="tpause">暂停</button>
          <button id="tend">提前结束</button>
        </div>
      </div>

      <div class="grp" id="g-post">
        <div id="postinfo" style="text-align:center;font-size:13px;color:var(--sub);margin-bottom:12px"></div>
        <div id="notebox" style="display:none;margin-bottom:12px">
          <textarea id="notetext" rows="4" placeholder="这个番茄做了什么？（可留空，拖右下角可以放大）" style="width:100%;font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;resize:vertical;min-height:72px"></textarea>
          <div class="btns" style="margin-top:8px"><button id="noteins" title="把悬浮笔记里已勾选的事项放进来">插入完成事项</button><button class="primary" id="notesave">保存备注</button><button id="noteskip">跳过</button></div>
        </div>
        <div class="btns" id="breakbtns" style="margin-bottom:8px">
          <button id="tshort">短休息</button>
          <button id="tlong">长休息</button>
        </div>
        <div class="btns">
          <button id="tretry" style="display:none">重试写入</button>
          <button id="tdiscard" style="display:none">放弃记录</button>
          <button class="primary" id="tclear">完成</button>
        </div>
      </div>

      <div class="btns" style="margin-top:18px">
        <button class="ghost" id="tmini">迷你窗口</button>
        <button class="ghost" id="tnotes" title="悬浮在桌面上的待办小笔记，番茄期间随手记做了什么">悬浮笔记</button>
      </div>
    </section>

    <section class="page" id="p-tasks">
      <div class="search">
        <input id="keyword" type="text" placeholder="搜索任务（留空显示全部）">
        <label><input id="done" type="checkbox">含已完成</label>
      </div>
      <div id="taskinfo"></div>
      <div id="tasks"></div>
    </section>

    <section class="page" id="p-set">
      <div class="sh">内核</div>
      <div class="sc">
        <div class="sr col"><span class="sl">内核程序路径</span><input id="kernel_path" type="text"></div>
        <div class="sr col"><span class="sl">工作空间</span><input id="workspace" type="text" placeholder="例如 C:\SiYuanData"></div>
        <div class="sr"><span class="sl">端口</span><input id="port" type="number" min="1" max="65535" class="sn"></div>
        <div class="sr col"><span class="sl">API token<small>内核设了访问授权码时必填</small></span><input id="api_token" type="password" autocomplete="off" placeholder="思源 设置 → 关于 → API token"></div>
      </div>

      <div class="sh">通用</div>
      <div class="sc">
        <label class="sr"><span class="sl">开机自动启动<small>只进托盘，不弹窗口</small></span><input id="autostart" type="checkbox" class="sw"></label>
        <div class="sr"><span class="sl">短休息（分钟）</span><input id="bshort" type="number" min="0.1" step="any" class="sn"></div>
        <div class="sr"><span class="sl">长休息（分钟）</span><input id="blong" type="number" min="0.1" step="any" class="sn"></div>
      </div>

      <div class="sh">随机微休息</div>
      <div class="sc">
        <label class="sr"><span class="sl">启用<small>仅专注运行时随机提醒，暂停时停止，不写入番茄记录</small></span><input id="micro_enabled" type="checkbox" class="sw"></label>
        <div class="sr"><span class="sl">间隔（分钟）</span><span class="pair"><input id="micro_min" type="number" min="0.1" max="1440" step="0.1" value="3" class="sn" aria-label="最小间隔"><span>–</span><input id="micro_max" type="number" min="0.1" max="1440" step="0.1" value="5" class="sn" aria-label="最大间隔"></span></div>
        <div class="sr"><span class="sl">每次时长（秒）</span><input id="micro_seconds" type="number" min="1" max="3600" step="1" value="10" class="sn"></div>
        <label class="sr"><span class="sl">弹窗提醒</span><input id="micro_popup" type="checkbox" class="sw" checked></label>
        <label class="sr"><span class="sl">开始和结束提示音</span><input id="micro_sound" type="checkbox" class="sw" checked></label>
        <div class="sr end"><button id="micro_save">保存</button></div>
      </div>

      <div class="sh">同步</div>
      <div class="sc">
        <label class="sr"><span class="sl">定时触发思源同步<small>后台内核不会自己同步，手机端要它才能拿到记录</small></span><input id="sync_enabled" type="checkbox" class="sw"></label>
        <div class="sr col" style="gap:2px"><div id="syncsetting" class="hint"></div></div>
        <div class="sr"><button id="synconow">立即同步</button><div id="syncinfo" class="hint" style="white-space:pre-wrap;text-align:right"></div></div>
        <div id="syncproxy" style="display:none;font-size:12px;color:var(--bad);white-space:pre-wrap;padding:8px 0"></div>
        <div class="hint" style="padding:8px 0">间隔跟随思源「设置 → 关于 → 同步」里的自动同步间隔；同步本身由思源完成，本工具只负责按时触发。</div>
      </div>

      <div class="sh">版本与更新</div>
      <div class="sc">
        <div class="sr"><span class="sl">当前版本<small id="upsub">每 6 小时自动检查 GitHub 发布</small></span><span id="upcur" style="font-variant-numeric:tabular-nums"></span></div>
        <div class="sr col" id="uprow" style="display:none">
          <div id="upline" style="font-weight:600"></div>
          <div id="upnotes"></div>
          <div id="upbar"><div id="upfill"></div></div>
        </div>
        <div class="sr col" id="clrow" style="display:none"><div id="cllist"></div></div>
        <div class="sr end" style="gap:8px">
          <button id="clbtn" class="ghost">更新内容</button>
          <button id="upcheck">检查更新</button>
          <button id="updl" class="primary" style="display:none">下载</button>
          <button id="upinst" class="primary" style="display:none">安装并重启</button>
        </div>
      </div>

      <div class="sh">支持作者</div>
      <div class="sc" style="padding:14px;text-align:center">
        <img src="donate.jpg" alt="微信打赏二维码" style="width:180px;height:auto;padding:10px;background:#fff;border-radius:8px">
        <div class="hint" style="margin-top:8px">觉得好用的话，可以微信扫码请作者喝杯咖啡 ☕</div>
      </div>
    </section>
  </main>

  <div id="msg"></div>
  <nav>
    <button class="on" data-p="timer"><b>◔</b>计时</button>
    <button data-p="tasks"><b>☰</b>任务</button>
    <button data-p="set"><b>⚙</b>设置<i class="badge" id="upbadge"></i></button>
  </nav>

<script src="common.js"></script>
<script>
const { invoke } = window.__TAURI__.core;
const $ = (id) => document.getElementById(id);
const port = () => Number($("port").value);
const readConfig = () => ({
  kernel_path: $("kernel_path").value.trim(),
  workspace: $("workspace").value.trim(),
  port: port(),
  api_token: $("api_token").value.trim(),
  sync_enabled: $("sync_enabled").checked,
  micro_break: {
    enabled: $("micro_enabled").checked,
    min_minutes: Number($("micro_min").value),
    max_minutes: Number($("micro_max").value),
    duration_seconds: Number($("micro_seconds").value),
    popup: $("micro_popup").checked,
    sound: $("micro_sound").checked,
  },
});

let msgTimer = null;
function say(text, ok = true) {
  const m = $("msg");
  clearTimeout(msgTimer);
  if (!text) { m.style.display = "none"; return; }
  m.textContent = text; m.className = ok ? "ok" : "bad"; m.style.display = "block";
  if (ok) msgTimer = setTimeout(() => (m.style.display = "none"), 4000);
}
const cmd = async (name, args) => { try { await invoke(name, args); return true; } catch (e) { say(String(e), false); return false; } };

// ---- 页签 ----
function show(p) {
  for (const b of document.querySelectorAll("nav button")) b.classList.toggle("on", b.dataset.p === p);
  for (const s of document.querySelectorAll(".page")) s.classList.toggle("on", s.id === "p-" + p);
  if (p === "tasks") searchTasks();
}
for (const b of document.querySelectorAll("nav button")) b.onclick = () => show(b.dataset.p);

// ---- 内核 ----
let kernelRunning = false;
async function refresh() {
  try {
    const s = await invoke("kernel_status", { port: port() });
    kernelRunning = s.running;
    $("dot").classList.toggle("on", s.running);
    const suffix = syncSuffix();
    $("status").textContent = (s.running
      ? `内核运行中 · ${port()}${s.owned ? "" : "（非本工具启动）"}`
      : "内核未运行") + (suffix ? ` · ${suffix}` : "");
    $("kstart").style.display = s.running ? "none" : "";
    $("kstop").style.display = s.running && s.owned ? "" : "none";
  } catch (e) { $("status").textContent = "状态检测失败：" + e; }
}
async function act(name, args, doneMsg) {
  say("请稍候…");
  try { const r = await invoke(name, args); say(doneMsg || r || "完成"); }
  catch (e) { say(String(e), false); }
  refresh();
}
$("kstart").onclick = async () => { await invoke("save_config", { config: readConfig() }); act("kernel_start", { config: readConfig() }); };
$("kstop").onclick = () => act("kernel_stop", { port: port() });
$("ui").onclick = () => act("open_ui", { port: port() }, "已用默认浏览器打开");
["kernel_path", "workspace", "port", "api_token"].forEach((id) => ($(id).onchange = () => invoke("save_config", { config: readConfig() })));

// ---- 任务：一律显示全部历史，点一下选中并回到计时页 ----
let selectedTask = null;
function renderTaskCard() {
  $("tc-sel").style.display = selectedTask ? "" : "none";
  $("tc-free").style.display = selectedTask ? "none" : "";
  $("tc-clear").style.display = selectedTask ? "" : "none";
  $("tc-pick").textContent = selectedTask ? "换任务" : "选任务";
  if (selectedTask) {
    $("tc-name").textContent = selectedTask.title;
    $("tc-doc").textContent = selectedTask.doc_path ? `📄 ${selectedTask.doc_path}` : selectedTask.block_id ? "已绑定块" : "未绑定块";
  }
}
$("tc-pick").onclick = () => show("tasks");
$("tc-clear").onclick = () => { selectedTask = null; renderTaskCard(); };
let searchSeq = 0;
async function searchTasks() {
  const seq = ++searchSeq;
  if (!kernelRunning) { $("taskinfo").textContent = "内核没有运行，先在顶部启动内核"; $("tasks").replaceChildren(); return; }
  $("taskinfo").textContent = "搜索中…";
  try {
    const list = await invoke("search_tasks", { port: port(), scope: "all", keyword: $("keyword").value, includeCompleted: $("done").checked });
    if (seq !== searchSeq) return;
    $("taskinfo").textContent = `共 ${list.length} 条，点一下选择`;
    const box = $("tasks"); box.replaceChildren();
    for (const t of list) {
      const el = document.createElement("div");
      el.className = "card task" + (t.completed ? " done" : "") + (selectedTask && selectedTask.id === t.id ? " sel" : "");
      const name = document.createElement("div"); name.className = "name"; name.textContent = t.title || "（无标题）";
      const meta = document.createElement("div"); meta.className = "meta";
      meta.textContent = [t.date || "无日期", t.doc_path ? `📄 ${t.doc_path}` : t.block_id ? "已绑定块" : "未绑定块"].join(" · ");
      el.append(name, meta);
      el.onclick = () => { selectedTask = t; renderTaskCard(); show("timer"); };
      box.appendChild(el);
    }
  } catch (e) { if (seq === searchSeq) { $("taskinfo").textContent = ""; say(String(e), false); } }
}
let kwTimer = null;
$("keyword").oninput = () => { clearTimeout(kwTimer); kwTimer = setTimeout(searchTasks, 300); };
$("done").onchange = searchTasks;

// ---- 番茄钟：计时和状态都在后端，这里只是视图（迷你窗口读同一份状态） ----
let timerState = null;
async function loadTimer() {
  try { timerState = await invoke("timer_get"); } catch (e) { say(String(e), false); }
  renderClock();
}
let noteShown = false;
const submitNote = async (note) => { if (await cmd("timer_submit_note", { note })) $("notetext").value = ""; };
$("noteins").onclick = () => TimerView.insertDoneNotes($("notetext"), invoke);
$("notesave").onclick = () => submitNote($("notetext").value);
$("noteskip").onclick = () => submitNote("");
function plannedMs() { return Number($("minutes").value) * 60000; }
function renderClock() {
  const s = timerState;
  const f = TimerView.flags(s);
  const total = s ? s.planned_ms : plannedMs();
  const remaining = s ? TimerView.remaining(s) : plannedMs();
  const p = s ? (s.status === "finished" ? (s.completed || s.kind !== "work" ? 1 : total ? TimerView.elapsed(s) / total : 0) : Math.min(1, Math.max(0, TimerView.elapsed(s) / total))) : 0;
  $("ring").style.setProperty("--deg", `${p * 360}deg`);
  $("clock").textContent = TimerView.fmt(remaining);
  document.title = s && s.status !== "finished" ? `${TimerView.fmt(remaining)} 思源番茄钟` : "思源番茄钟";
  const brk = s && s.kind && s.kind !== "work";
  $("phase").textContent = !s ? "准备开始" : s.status === "finished" ? (brk ? "休息结束" : s.completed ? "已完成" : "已提前结束") : s.status === "paused" ? "已暂停" : brk ? (s.kind === "longBreak" ? "长休息中" : "短休息中") : "专注中";

  $("g-pre").classList.toggle("on", !s);
  $("g-run").classList.toggle("on", !!s && s.status !== "finished");
  $("g-post").classList.toggle("on", !!s && s.status === "finished");
  $("runinfo").textContent = s ? s.task.title : "";
  $("tpause").textContent = f.pauseLabel;
  $("postinfo").textContent = TimerView.info(s);
  $("notebox").style.display = f.awaitingNote ? "" : "none";
  if (f.awaitingNote && !noteShown) setTimeout(() => $("notetext").focus(), 0);
  noteShown = f.awaitingNote;
  $("breakbtns").style.display = f.canBreak ? "" : "none";
  $("tretry").style.display = f.canRetry ? "" : "none";
  $("tdiscard").style.display = f.canDiscard ? "" : "none";
  $("tclear").disabled = !f.canClear; // 记录没写成功前不允许清除，避免丢记录
}
for (const b of document.querySelectorAll(".chip")) b.onclick = () => { $("minutes").value = b.dataset.m; syncChips(); renderClock(); };
function syncChips() { for (const b of document.querySelectorAll(".chip")) b.classList.toggle("on", Number(b.dataset.m) === Number($("minutes").value)); }
$("minutes").oninput = () => { syncChips(); renderClock(); };

$("tstart").onclick = async () => {
  const minutes = Number($("minutes").value);
  if (!(minutes > 0)) return say("时长必须大于 0", false);
  if (!kernelRunning && !confirm("内核没有运行，计时结束后记录会先写不进去（内核启动后会自动补写）。仍然开始吗？")) return;
  say("");
  const task = selectedTask
    ? { id: selectedTask.id, title: selectedTask.title, block_id: selectedTask.block_id }
    : { id: "", title: $("freetitle").value.trim(), block_id: null };
  if (await cmd("timer_start", { task, minutes, port: port() }) && selectedTask) pushRecent(selectedTask);
};
$("tpause").onclick = () => cmd("timer_toggle_pause");
$("tend").onclick = () => cmd("timer_end");
$("tretry").onclick = () => cmd("timer_retry", { port: port() });
$("tclear").onclick = () => cmd("timer_clear"); // 任务选择保留，方便接着做同一个任务
$("tdiscard").onclick = () => { if (confirm("放弃后这次计时不会写入番茄记录，确定吗？")) cmd("timer_discard"); };
$("tmini").onclick = () => cmd("open_mini");
$("tnotes").onclick = () => cmd("open_notes");

// ---- 最近用过的任务（C2）：只存在本机，选任务开始计时时记一笔 ----
const RECENT_MAX = 6;
const loadRecent = () => { try { return JSON.parse(localStorage.getItem("recentTasks") || "[]"); } catch { return []; } };
function pushRecent(t) {
  const list = [{ id: t.id, title: t.title, block_id: t.block_id || null, doc_path: t.doc_path || null }, ...loadRecent().filter((x) => x.id !== t.id)].slice(0, RECENT_MAX);
  try { localStorage.setItem("recentTasks", JSON.stringify(list)); } catch {}
  renderRecent();
}
function renderRecent() {
  const list = loadRecent();
  $("recentbox").style.display = list.length ? "" : "none";
  const box = $("recent"); box.replaceChildren();
  for (const t of list) {
    const item = document.createElement("span");
    item.className = "recent-task";
    const b = document.createElement("button");
    b.className = "chip" + (selectedTask && selectedTask.id === t.id ? " on" : "");
    b.textContent = t.title.length > 14 ? t.title.slice(0, 14) + "…" : t.title;
    b.title = t.title + (t.doc_path ? `（${t.doc_path}）` : "");
    b.onclick = () => { selectedTask = t; renderTaskCard(); renderRecent(); };
    const remove = document.createElement("button");
    remove.type = "button";
    remove.className = "recent-remove";
    remove.textContent = "×";
    remove.title = "从最近用过中移除";
    remove.setAttribute("aria-label", `从最近用过中移除：${t.title}`);
    remove.onclick = () => {
      try { localStorage.setItem("recentTasks", JSON.stringify(loadRecent().filter((x) => x.id !== t.id))); } catch { return; }
      renderRecent();
    };
    item.append(b, remove);
    box.appendChild(item);
  }
}

// ---- 同步（后端定时调内核 /api/sync/performSync；这里只显示与手动触发） ----
let syncState = null;
function ago(ts) {
  const d = Date.now() - ts;
  if (d < 60000) return "刚刚";
  if (d < 3600000) return `${Math.floor(d / 60000)} 分钟前`;
  if (d < 86400000) return `${Math.floor(d / 3600000)} 小时前`;
  return `${Math.floor(d / 86400000)} 天前`;
}
function syncSuffix() {
  const s = syncState;
  if (!s) return "";
  if (s.syncing) return "同步中…";
  if (!s.last_sync_at) return s.last_error ? "同步失败" : "";
  return (s.last_ok ? "上次同步 " : "同步失败 ") + ago(s.last_sync_at);
}
function renderSync() {
  const s = syncState;
  const info = $("syncinfo"), proxy = $("syncproxy"), setting = $("syncsetting");
  if (!s) { info.textContent = ""; proxy.style.display = "none"; setting.textContent = ""; return; }
  setting.textContent = s.siyuan_enabled
    ? (s.siyuan_interval_sec > 0
      ? `思源设置：已启用同步，自动同步间隔 ${s.siyuan_interval_sec} 秒（思源默认 30 秒，本工具照此触发）`
      : "思源设置：已启用同步，但没有设置自动同步间隔 → 只能手动同步")
    : "思源设置：同步未启用 → 触发也没用";
  let text;
  if (s.syncing) text = `同步中…（${Math.round(s.elapsed_ms / 1000)} 秒）`;
  else if (!s.last_sync_at) text = s.last_error ? `上次同步失败：${s.last_error}` : "还没有同步过";
  else text = `${s.last_ok ? "上次同步" : "上次同步失败"}：${ago(s.last_sync_at)}，耗时 ${(s.duration_ms / 1000).toFixed(1)} 秒`
    + (s.last_error ? `\n${s.last_error}` : "") + (s.last_stat ? `\n${s.last_stat}` : "");
  info.textContent = text;
  info.style.color = s.syncing ? "var(--sub)" : (s.last_ok ? "var(--sub)" : "var(--bad)");
  if (s.proxy_warning) { proxy.textContent = `⚠ ${s.proxy_warning}`; proxy.style.display = ""; }
  else proxy.style.display = "none";
}
async function refreshSync() {
  try { syncState = await invoke("sync_status"); } catch { syncState = null; }
  renderSync();
}
$("synconow").onclick = async () => {
  if (!kernelRunning) return say("内核没有运行，先启动内核再同步", false);
  say("正在同步，可能要好几分钟…");
  try { say(await invoke("sync_now", { port: port() })); } catch (e) { say(String(e), false); }
  refreshSync(); refresh();
};
$("sync_enabled").onchange = () => invoke("save_config", { config: readConfig() });
$("micro_save").onclick = async () => {
  const config = readConfig();
  const m = config.micro_break;
  if (!Number.isFinite(m.min_minutes) || !Number.isFinite(m.max_minutes)
      || m.min_minutes < 0.1 || m.max_minutes < m.min_minutes || m.max_minutes > 1440
      || !Number.isInteger(m.duration_seconds) || m.duration_seconds < 1 || m.duration_seconds > 3600) {
    return say("间隔需为 0.1～1440 分钟，最大值不能小于最小值；休息需为 1～3600 整数秒", false);
  }
  if (m.enabled && !m.popup && !m.sound) return say("请至少开启弹窗或提示音", false);
  if (await cmd("save_config", { config })) say("微休息设置已保存，下一次提醒按新设置安排");
};

// ---- 开机自启（C3） ----
$("autostart").onchange = async () => {
  const want = $("autostart").checked;
  if (!(await cmd("autostart_set", { enabled: want }))) $("autostart").checked = !want;
  else say(want ? "已设置开机自启" : "已取消开机自启");
};

// 休息时长，迷你窗口读同一份（同源 localStorage）
for (const [id, key, long] of [["bshort", "breakShort", false], ["blong", "breakLong", true]]) {
  $(id).value = TimerView.breakMinutes(long);
  $(id).oninput = () => { try { localStorage.setItem(key, $(id).value); } catch {} };
}
const startBreak = (long) => {
  const minutes = Number($(long ? "blong" : "bshort").value);
  if (!(minutes > 0)) return say("休息时长必须大于 0，请到设置页修改", false);
  say("");
  cmd("timer_start_break", { minutes, long, port: port() });
};
$("tshort").onclick = () => startBreak(false);
$("tlong").onclick = () => startBreak(true);


// ---- 版本更新：后台定时查 GitHub，有新版就在顶部和设置页提醒，可在软件内下载安装 ----
let upState = null;
function fmtMB(n) { return (n / 1048576).toFixed(1) + " MB"; }
function renderUpdate() {
  const u = upState; if (!u) return;
  $("upcur").textContent = "v" + u.current;
  const has = ["available", "downloading", "ready", "installing"].includes(u.status);
  $("upbadge").classList.toggle("on", has);
  $("upbanner").classList.toggle("on", has);
  $("uptext").textContent = u.status === "ready" ? `新版本 ${u.latest} 已下载好，可以安装并重启`
    : u.status === "downloading" ? `正在下载 ${u.latest}…`
    : u.status === "installing" ? "正在安装，马上重启…"
    : `发现新版本 ${u.latest}（当前 v${u.current}）`;
  $("uprow").style.display = has ? "" : "none";
  $("upline").textContent = has ? `${u.latest}${u.size ? "（" + fmtMB(u.size) + "）" : ""}` : "";
  $("upnotes").textContent = u.notes || "";
  const dl = u.status === "downloading";
  $("upbar").style.display = dl ? "block" : "none";
  $("upfill").style.width = u.size ? `${Math.min(100, u.downloaded / u.size * 100)}%` : "0";
  $("updl").style.display = u.status === "available" ? "" : "none";
  $("updl").textContent = "下载" + (u.size ? "（" + fmtMB(u.size) + "）" : "");
  $("upinst").style.display = u.status === "ready" ? "" : "none";
  $("upcheck").disabled = ["checking", "downloading", "installing"].includes(u.status);
  $("upcheck").textContent = u.status === "checking" ? "检查中…" : "检查更新";
  $("upsub").textContent = u.error ? u.error
    : u.status === "idle" && u.checked_at ? `已是最新版本（${new Date(u.checked_at).toLocaleTimeString()} 检查）`
    : "每 6 小时自动检查 GitHub 发布";
  $("upsub").style.color = u.error ? "var(--bad)" : "";
  if (!u.can_install && has) $("upsub").textContent = "开发版只检查，不自动安装";
}
async function loadUpdate() { try { upState = await invoke("update_get"); } catch {} renderUpdate(); }
$("upcheck").onclick = () => cmd("update_check");
$("updl").onclick = () => cmd("update_download");
$("upinst").onclick = () => cmd("update_install");
$("upgo").onclick = () => { show("set"); document.querySelector("main").scrollTop = $("upcheck").offsetTop; };
window.__TAURI__.event.listen("update-changed", (e) => { upState = e.payload; renderUpdate(); });
loadUpdate().then(loadChangelog);

// ---- 更新内容：CHANGELOG.md 打进了 exe；升级后第一次打开提示一次 ----
let changelog = [];
async function loadChangelog() {
  try { changelog = await invoke("changelog_get"); } catch { return; }
  const list = $("cllist"); list.replaceChildren();
  const cur = (upState && upState.current) || "";
  for (const e of changelog) {
    const d = document.createElement("details"); d.className = "cl";
    d.open = e.version === cur || (e.version === "未发布" && !changelog.some((x) => x.version === cur));
    const sm = document.createElement("summary");
    sm.textContent = e.version === "未发布" ? "未发布" : "v" + e.version;
    if (e.version === cur) sm.textContent += "（当前版本）";
    if (e.date) { const t = document.createElement("small"); t.textContent = e.date; sm.append(t); }
    const pre = document.createElement("pre"); pre.textContent = e.notes;
    d.append(sm, pre); list.append(d);
  }
  // 升级后第一次打开：提示一次（第一次安装不提示）
  try {
    const seen = localStorage.getItem("seenVersion");
    if (cur && seen && seen !== cur && changelog.some((e) => e.version === cur)) {
      $("newtext").textContent = `已更新到 v${cur}，看看这个版本有什么新内容`;
      $("newbanner").classList.add("on");
    }
    if (cur) localStorage.setItem("seenVersion", cur);
  } catch {}
}
function showChangelog() {
  show("set"); $("clrow").style.display = ""; $("clbtn").textContent = "收起更新内容";
  document.querySelector("main").scrollTop = $("clrow").offsetTop;
}
$("clbtn").onclick = () => {
  const open = $("clrow").style.display !== "none";
  $("clrow").style.display = open ? "none" : "";
  $("clbtn").textContent = open ? "更新内容" : "收起更新内容";
};
$("newgo").onclick = () => { showChangelog(); $("newbanner").classList.remove("on"); };
$("newx").onclick = () => $("newbanner").classList.remove("on");
window.__TAURI__.event.listen("timer-changed", loadTimer);
window.__TAURI__.event.listen("sync-changed", () => { refreshSync(); });
setInterval(renderClock, 250);

(async () => {
  const c = await invoke("get_config");
  $("kernel_path").value = c.kernel_path; $("workspace").value = c.workspace; $("port").value = c.port; $("api_token").value = c.api_token || "";
  $("sync_enabled").checked = c.sync_enabled !== false;
  const micro = c.micro_break || {};
  $("micro_enabled").checked = micro.enabled === true;
  $("micro_min").value = micro.min_minutes ?? 3;
  $("micro_max").value = micro.max_minutes ?? 5;
  $("micro_seconds").value = micro.duration_seconds ?? 10;
  $("micro_popup").checked = micro.popup !== false;
  $("micro_sound").checked = micro.sound !== false;
  renderTaskCard(); renderRecent();
  try { $("autostart").checked = await invoke("autostart_get"); } catch {}
  await refresh(); setInterval(refresh, 3000);
  await refreshSync(); setInterval(refreshSync, 3000);
  await loadTimer();
  const s = timerState;
  if (s && s.recovered) {
    say(s.status === "finished"
      ? (s.written ? `上次计时已结束并已写入：${s.task.title}` : `检测到上次结束后还没写入的记录，正在补写：${s.task.title}`)
      : s.status === "paused" ? `已从上次的计时恢复（暂停中）：${s.task.title}`
      : `已从上次的计时恢复：${s.task.title}（程序关闭期间的时间也算在计时里）`);
  }
})();
</script>
