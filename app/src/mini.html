<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>番茄钟</title>
<style>
  :root { color-scheme: light dark; font-family: "Microsoft YaHei UI", system-ui, sans-serif; --fg: CanvasText; --bg: Canvas; --accent: #e5483d; }
  html, body { margin: 0; height: 100%; overflow: hidden; user-select: none; }
  body { box-sizing: border-box; }
  button { cursor: pointer; font: inherit; }

  /* 普通模式：和之前一样的小窗，带按钮 */
  #normal { box-sizing: border-box; padding: 8px 10px; height: 100%; display: flex; flex-direction: column; overflow-y: auto; }
  #normal > * { flex-shrink: 0; }
  #notebox { flex: 1 0 90px; min-height: 90px; flex-direction: column; }
  #notebox textarea { flex: 1; min-height: 40px; resize: vertical; }
  #topbar { display: flex; align-items: center; gap: 6px; height: 22px; font-size: 12px; opacity: .85; }
  #topbar .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }
  #ttitle { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #tshrink { border: 0; background: transparent; color: inherit; font-size: 14px; padding: 0 4px; opacity: .6; }
  #tshrink:hover { opacity: 1; }
  #clock { flex: none; padding: 2px 0; font-size: 44px; line-height: 1.15; text-align: center; font-variant-numeric: tabular-nums; }
  #nprog { height: 4px; border-radius: 2px; margin: 4px 6px 8px; background: color-mix(in srgb, CanvasText 14%, transparent); overflow: hidden; flex: none; }
  #nfill { height: 100%; width: 0; background: var(--accent); }
  #info { font-size: 12px; text-align: center; opacity: .8; margin: 0 0 8px; min-height: 16px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  #normal .row button { padding: 0 14px; height: 28px; font-size: 12px; border-radius: 6px; border: .5px solid color-mix(in srgb, CanvasText 35%, transparent); background: transparent; color: CanvasText; }
  #normal .row button:hover { background: color-mix(in srgb, CanvasText 8%, transparent); }
  #normal .row button.primary { background: CanvasText; color: Canvas; border-color: CanvasText; }
  #normal .row button.primary:hover { opacity: .85; }

  /* 迷你模式：无边框、透明背景、可拖动，悬停才出按钮 */
  #compact { display: none; position: relative; width: 100%; height: 100%; }
  /* color-scheme 会让画布不透明，迷你模式要透明就必须去掉，颜色改用明确的变量 */
  html.compact { color-scheme: normal; background: var(--bg); --fg: #222; --bg: #fff; --track: #dcdcd8; --btn: #e8e8e4; }
  @media (prefers-color-scheme: dark) { html.compact { --fg: #eee; --bg: #2b2b2b; --track: #484846; --btn: #3d3d3b; } }
  body.compact { background: var(--bg); color: var(--fg); }
  body.compact #normal { display: none; }
  body.compact #compact { display: block; }
  .cbtn { border: 0; border-radius: 6px; background: rgba(255,255,255,.92); color: #2f2f2f; padding: 0; line-height: 1; display: inline-flex; align-items: center; justify-content: center; }
  .acts { display: none; gap: 3px; align-items: center; }
  #compact:hover .acts { display: flex; }

  /* 圆环 */
  #ring { display: none; position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(from -90deg, var(--accent) var(--deg, 0deg), var(--track) var(--deg, 0deg)); }
  #ring .inner { position: absolute; inset: 4px; border-radius: 50%; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #ring .t { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
  #ring .acts { position: absolute; inset: 0; align-items: center; justify-content: center; background: var(--bg); border-radius: 50%; margin: 4px; }
  #ring .cbtn { width: 20px; height: 20px; font-size: 11px; background: var(--btn); color: var(--fg); }
  body.m-ring #ring { display: block; }
  #ring .cycle { position: absolute; top: -2px; right: -2px; width: 14px; height: 14px; font-size: 9px; display: none; z-index: 3; }
  body.m-ring #compact:hover .cycle { display: inline-flex; }

  /* 横向进度条 */
  #bar { display: none; position: absolute; inset: 0; background: var(--bg); padding: 3px 8px 5px; box-sizing: border-box; flex-direction: column; justify-content: space-between; }
  body.m-bar #bar { display: flex; }
  #bar .title { font-size: 10px; opacity: .65; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #bar .line { display: flex; align-items: center; justify-content: space-between; }
  #bar .t { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
  #bar .cbtn { width: 18px; height: 18px; font-size: 10px; background: var(--btn); color: var(--fg); }
  .track { height: 4px; border-radius: 2px; background: var(--track); overflow: hidden; }
  .fill { height: 100%; width: 0; background: var(--accent); }

  /* 极简进度条：只有一条线，悬停出按钮 */
  #minimal { display: none; position: absolute; inset: 0; background: var(--bg); padding: 0 6px; box-sizing: border-box; align-items: center; }
  body.m-minimal #minimal { display: flex; }
  #minimal .track { flex: 1; height: 6px; }
  #minimal .acts { position: absolute; inset: 0; justify-content: center; background: var(--bg); border-radius: 6px; }
  #minimal .cbtn { width: 16px; height: 16px; font-size: 9px; background: var(--btn); color: var(--fg); }
  #minimal .tt { position: absolute; left: 0; right: 0; text-align: center; font-size: 9px; font-weight: 700; mix-blend-mode: difference; color: #fff; pointer-events: none; }
</style>
</head>
<body>
  <div id="normal">
    <div id="topbar"><span class="dot"></span><span id="ttitle"></span><button id="tshrink" title="切换到迷你模式" aria-label="切换到迷你模式">⇄</button></div>
    <div id="clock">--:--</div>
    <div id="nprog"><div id="nfill"></div></div>
    <div id="info"></div>
    <div id="notebox" style="display:none;margin-bottom:6px">
      <textarea id="notetext" rows="2" placeholder="这个番茄做了什么？（可留空，拖右下角或拉大窗口可以放大）" style="width:100%;box-sizing:border-box;font:inherit;font-size:12px"></textarea>
      <div class="row" style="margin-top:4px"><button id="noteins" title="把悬浮笔记里已勾选的事项放进来">插入完成事项</button><button id="notesave">保存备注</button><button id="noteskip">跳过</button></div>
    </div>
    <div class="row">
      <button id="tgo" style="display:none" title="沿用上一个任务和专注时长开始新的番茄">开始</button>
      <button id="tpause">暂停</button>
      <button id="tend">结束</button>
      <button id="tshort" style="display:none">短休息</button>
      <button id="tlong" style="display:none">长休息</button>
      <button id="tnext" style="display:none" title="沿用同一个任务继续下一个番茄">继续专注</button>
      <button id="tretry" style="display:none">重试写入</button>
      <button id="tdiscard" style="display:none">放弃</button>
      <button id="tclear" style="display:none" title="结束本次计时显示，已保存的番茄记录会保留">完成</button>
    </div>
  </div>

  <div id="compact">
    <div id="ring">
      <div class="inner"><span class="t" id="rt">--:--</span></div>
      <div class="acts"><button class="cbtn" data-act="pause" title="暂停/继续">⏯</button><button class="cbtn" data-act="end" title="结束">⏹</button></div>
      <button class="cbtn cycle" data-act="cycle" title="切换样式">⇄</button>
    </div>
    <div id="bar">
      <div class="title" id="bt"></div>
      <div class="line">
        <span class="t" id="bc">--:--</span>
        <span class="acts" style="display:flex"><button class="cbtn" data-act="pause" title="暂停/继续">⏯</button><button class="cbtn" data-act="end" title="结束">⏹</button><button class="cbtn" data-act="cycle" title="切换样式">⇄</button></span>
      </div>
      <div class="track"><div class="fill" id="bf"></div></div>
    </div>
    <div id="minimal">
      <div class="track"><div class="fill" id="mf"></div></div>
      <span class="tt" id="mt"></span>
      <div class="acts"><button class="cbtn" data-act="pause" title="暂停/继续">⏯</button><button class="cbtn" data-act="end" title="结束">⏹</button><button class="cbtn" data-act="cycle" title="切换样式">⇄</button></div>
    </div>
  </div>

<script src="common.js"></script>
<script>
const { invoke } = window.__TAURI__.core;
const $ = (id) => document.getElementById(id);
const STYLES = ["ring", "bar", "minimal"];
let st = null;
let preferred = "normal"; // normal | ring | bar | minimal
try { preferred = localStorage.getItem("miniMode") || "normal"; } catch {}
if (preferred !== "normal" && !STYLES.includes(preferred)) preferred = "normal";
let applied = null;

// 没有计时、或结束后还要处理（清除/重试/放弃）时，回到普通模式，因为迷你模式没有这些按钮
function effectiveMode() {
  const live = (st && st.status !== "finished") || (!st && !!last);
  return live ? preferred : "normal";
}
function applyMode() {
  const m = effectiveMode();
  if (m === applied) return;
  applied = m;
  document.body.classList.toggle("compact", m !== "normal");
  document.documentElement.classList.toggle("compact", m !== "normal");
  for (const s of STYLES) document.body.classList.toggle("m-" + s, m === s);
  invoke("set_mini_mode", { mode: m }).catch((e) => ($("info").textContent = String(e)));
}
function setPreferred(m) {
  preferred = m;
  try { localStorage.setItem("miniMode", m); } catch {}
  applyMode();
  render();
}

async function load() { try { st = await invoke("timer_get"); } catch (e) { $("info").textContent = String(e); } render(); }
function progress() {
  if (!st) return 0;
  return Math.max(0, Math.min(1, TimerView.elapsed(st) / st.planned_ms));
}
// 记住上一个任务和专注时长：点“完成”清掉计时后，小窗口回到这个任务的“准备开始”
let last = null;
try { last = JSON.parse(localStorage.getItem("miniLast") || "null"); } catch {}
function rememberLast() {
  if (!st || !st.task || !st.task.title) return;
  const ms = st.work_ms || (!st.kind || st.kind === "work" ? st.planned_ms : 0) || (last && last.ms) || 25 * 60000;
  last = { task: st.task, port: st.port, ms };
  try { localStorage.setItem("miniLast", JSON.stringify(last)); } catch {}
}
function render() {
  applyMode();
  rememberLast();
  const ready = !st && !!last;
  const time = st ? TimerView.fmt(TimerView.remaining(st)) : ready ? TimerView.fmt(last.ms) : "--:--";
  $("clock").textContent = time;
  document.title = st && st.status !== "finished" ? `${time} 番茄钟` : "番茄钟";
  $("info").textContent = st ? TimerView.info(st) : ready ? "准备开始" : "没有计时（请在主窗口开始专注）";
  $("tgo").style.display = ready ? "" : "none";
  const f = TimerView.flags(st);
  $("tpause").style.display = $("tend").style.display = f.canPause ? "" : "none";
  $("tpause").textContent = f.pauseLabel;
  $("notebox").style.display = f.awaitingNote ? "flex" : "none";
  $("info").style.display = f.awaitingNote ? "none" : "";
  if (f.awaitingNote && !noteShown) setTimeout(() => $("notetext").focus(), 0);
  noteShown = f.awaitingNote;
  $("tshort").style.display = $("tlong").style.display = f.canBreak ? "" : "none";
  // 休息写入记录后，直接在小窗里接续下一个番茄（沿用同一个任务和上次时长）
  $("tnext").style.display = f.canNext ? "" : "none";
  if (f.canNext) {
    const mins = Math.round((st.work_ms || 25 * 60000) / 60000);
    $("tnext").textContent = `继续专注 ${mins} 分钟`;
    $("tnext").title = `沿用任务「${st.task.title}」再开一个 ${mins} 分钟的番茄`;
  }
  $("tretry").style.display = f.canRetry ? "" : "none";
  $("tdiscard").style.display = f.canDiscard ? "" : "none";
  $("tclear").style.display = f.canClear ? "" : "none";
  $("tshrink").style.display = f.canPause || ready ? "" : "none";
  $("ttitle").textContent = st ? st.task.title : ready ? last.task.title || "自由专注" : "";
  // 当前最该点的按钮用实心突出
  const primary = ready ? "tgo" : f.canClear ? "tclear" : f.canNext ? "tnext" : f.canRetry ? "tretry" : f.awaitingNote ? "notesave" : f.canPause ? "tpause" : null;
  for (const b of document.querySelectorAll("#normal .row button")) b.classList.toggle("primary", b.id === primary);

  const p = progress();
  const isBreak = !!st && !!st.kind && st.kind !== "work";
  document.documentElement.style.setProperty("--deg", `${p * 360}deg`);
  // 休息阶段整体改绿色，专注红色，暂停橙色
  document.documentElement.style.setProperty(
    "--accent",
    !st ? "#e5483d" : st.status === "paused" ? "#e6a23c" : isBreak ? "#2f9e44" : "#e5483d",
  );
  $("rt").textContent = time;
  $("bc").textContent = time;
  $("bt").textContent = st ? st.task.title : ready ? last.task.title || "自由专注" : "";
  // 准备开始时，迷你模式里的 ⏯ 变成 ▶（开始），⏹ 隐藏
  for (const b of document.querySelectorAll('#compact [data-act="pause"]')) { b.textContent = ready ? "▶" : "⏯"; b.title = ready ? "开始" : "暂停/继续"; }
  for (const b of document.querySelectorAll('#compact [data-act="end"]')) b.style.display = ready ? "none" : "";
  $("nfill").style.width = $("bf").style.width = $("mf").style.width = `${p * 100}%`;
  $("mt").textContent = time;
}

const cmd = async (name, args) => { try { await invoke(name, args); } catch (e) { $("info").textContent = String(e); } };
$("tpause").onclick = () => cmd("timer_toggle_pause");
$("tend").onclick = () => cmd("timer_end");
let noteShown = false;
const submitNote = async (note) => { try { await invoke("timer_submit_note", { note }); $("notetext").value = ""; } catch (e) { $("info").style.display = ""; $("info").textContent = String(e); } };
$("noteins").onclick = () => TimerView.insertDoneNotes($("notetext"), invoke);
$("notesave").onclick = () => submitNote($("notetext").value);
$("noteskip").onclick = () => submitNote("");
$("tshort").onclick = () => cmd("timer_start_break", { minutes: TimerView.breakMinutes(false), long: false, port: st.port });
$("tlong").onclick = () => cmd("timer_start_break", { minutes: TimerView.breakMinutes(true), long: true, port: st.port });
$("tretry").onclick = () => cmd("timer_retry", { port: st.port });
$("tnext").onclick = () => cmd("timer_next_work", { minutes: null, port: st.port });
const startLast = () => cmd("timer_start", { task: last.task, minutes: last.ms / 60000, port: last.port });
const pauseOrStart = () => (!st && last ? startLast() : cmd("timer_toggle_pause"));
$("tgo").onclick = startLast;
$("tclear").onclick = () => cmd("timer_clear");
// 小窗口里系统自带的确认框会被截断，所以改成就地二次确认：第一次点变成“确定放弃？”，4 秒内再点才放弃
let discardArm = null;
$("tdiscard").onclick = () => {
  if (!discardArm) {
    $("tdiscard").textContent = "确定放弃？";
    discardArm = setTimeout(() => { discardArm = null; $("tdiscard").textContent = "放弃"; }, 4000);
    return;
  }
  clearTimeout(discardArm); discardArm = null; $("tdiscard").textContent = "放弃";
  cmd("timer_discard");
};
$("tshrink").onclick = () => setPreferred(STYLES.includes(preferred) ? preferred : "bar");

// 迷你模式里的按钮：暂停/继续、结束、切换样式（圆环→横条→极简→普通→圆环）
$("compact").addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const a = b.dataset.act;
  if (a === "pause") pauseOrStart();
  else if (a === "end") cmd("timer_end");
  else if (a === "cycle") {
    const i = STYLES.indexOf(preferred);
    setPreferred(i === STYLES.length - 1 ? "normal" : STYLES[i + 1]);
  }
});
// 点圆环本体也能暂停/继续；双击切回普通模式
$("ring").addEventListener("click", (e) => { if (!e.target.closest("button")) pauseOrStart(); });
$("compact").addEventListener("dblclick", (e) => { if (!e.target.closest("button")) setPreferred("normal"); });
// 无边框窗口：在空白处按下鼠标拖动窗口
document.body.addEventListener("mousedown", (e) => {
  if (e.button === 0 && applied !== "normal" && !e.target.closest("button")) {
    window.__TAURI__.window.getCurrentWindow().startDragging().catch(() => {});
  }
});

window.__TAURI__.event.listen("timer-changed", load);
setInterval(render, 250);
load();
</script>
</body>
</html>
